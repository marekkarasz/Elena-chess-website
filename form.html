<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up here</title>
</head>
<body>
    <header class="page-header">
        <div class="wrapper">
            <div class="header-content">
            <img src="/images/crown.svg" alt="">
            <nav class="primary-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="instructor.html" target="_blank">Instructor</a></li>
                    <li><a href="form.html" target="_blank">Start Learning</a></li>
                </ul>
            </nav>
        </div>
        </div>
    </header>
    <main class="form">
        <form action="" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter a valid email" required>
            </div>
            <div class="form-group">
                <label for="password">Password: </label>
                <input pattern="^(?=.*[A-Za-z]) (?=.*\d).+$" type="password" placeholder="Minimum 12 characters"
                id="password" minlength="12" required>
            </div>
            <div class="form-group">
                <label for="select">Select Your Current Level</label>
                <select name="level" id="level">
                <option value="Begginer">Begginer</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
                <option value="Proffesional">Proffesional</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" class="checkbox" required>
                     I agree to the terms and services.
                </label>
                <button class="button">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
